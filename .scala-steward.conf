# Scala Steward configuration for Siida.
#
# HOCON format. Reference:
#   https://github.com/scala-steward-org/scala-steward/blob/main/docs/repo-specific-configuration.md
#
# Per spec 003-dependency-automation. The Go module under
# modules/crypto/native/ is intentionally NOT covered by this config
# (Scala Steward does not inspect Go modules; gnark-crypto bumps
# remain manual until a future spec replaces the Go path).

pullRequests.frequency = "@weekly"

commits.message = "scala-steward: bump ${artifactName} from ${currentVersion} to ${nextVersion}"

# Stay within constitution v2.0.0 stack lines by default. The pin
# uses the HOCON object form `{ prefix = "X.Y." }`, which Steward
# treats as a hard ceiling — bumps crossing the prefix are NOT
# proposed.
#
# artifactId MUST be the BASE name, without the Scala binary-version
# suffix: `cats-effect`, not `cats-effect_3`. Steward matches
# patterns against `artifactId.name` (the base name); the cross-
# published `_3` variant lives in a separate `maybeCrossName` field
# and is never compared. See UpdatePattern.findMatch:
#   byGroupId.filter(_.artifactId.forall(_ === ...artifactId.name))
# A suffixed artifactId therefore matches nothing and the whole
# pattern is silently inert — no warning, no log line.
#
# This is what actually caused Steward to propose cats-effect
# 3.5.7 -> 3.7.0 (PR #19) despite the pin. PR #19 attributed it to
# the `version = "3.5."` literal-string form and switched to the
# object form, but the version form was never the problem — the
# `_3` suffix was, so the pins stayed dead until 2026-07-20.
updates.pin = [
  { groupId = "org.apache.pekko",                               version = { prefix = "1.1." } },
  { groupId = "org.scala-lang",  artifactId = "scala3-library", version = { prefix = "3.6." } },
  { groupId = "org.typelevel",   artifactId = "cats-effect",    version = { prefix = "3.5." } },
]

# Ignore pre-release / RC / milestone / snapshot versions across the
# whole repo (the suffix matcher applies to any artefact).
updates.ignore = [
  { groupId = "org.scala-lang",  artifactId = "scala3-library", version = { suffix = "-RC" } },
  { groupId = "org.scala-lang",  artifactId = "scala3-library", version = { suffix = "-M"  } },
]

# Group related JVM-side bumps so a single review covers Pekko's
# sub-artefacts at once rather than one PR per sub-artefact.
updates.pullRequests.grouping = [
  { name = "pekko",        title = "Bump Pekko artefacts",        filter = [{ group = "org.apache.pekko" }] },
  { name = "munit",        title = "Bump munit artefacts",        filter = [{ group = "org.scalameta" }, { group = "org.typelevel", artifactId = "munit-cats-effect" }] },
]
