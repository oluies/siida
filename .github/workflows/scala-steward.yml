name: Scala Steward

# Opens PRs bumping JVM dependencies pinned in build.mill /
# .mill-version when newer versions are available on Maven Central.
# Pinning constraints live in .scala-steward.conf at the repository
# root so they travel with the code.
#
# Runs on GitHub Actions only — the Forgejo mirror is excluded by
# living under .github/ rather than .forgejo/, and the per-PR CI
# parity script ignores this file (it reads only the ci.yml workflow
# pair by exact path).
#
# Per maintainer instruction (spec 003-dependency-automation):
# the Go module under modules/crypto/native/ is OUT OF SCOPE for
# automation. Scala Steward only sees JVM dependencies.
#
# Mill installation: we download the mill-dist artefact from Maven
# Central at the .mill-version-pinned version, install it on PATH as
# `mill`, and tell scala-steward-action not to install Mill itself
# (its Coursier path doesn't carry the pinned version). This matches
# the install strategy of the project's own ./mill launcher — see the
# comment at mill:36 for why Maven Central rather than GitHub
# releases.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  # contents: write lets Steward push the update/<dep>-<ver> branches
  # it opens its PRs from. With contents: read it hits HTTP 403 on
  # the branch push (validated in run 26078562115).
  contents: write
  pull-requests: write

jobs:
  scala-steward:
    name: scala-steward
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        # Match the project's constitution-pinned JDK so Mill (installed
        # below) loads under the same JVM contributors use locally.
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Mill from Maven Central
        # The pinned Mill isn't in Coursier's app catalog (the path
        # scala-steward-action takes). Download mill-dist directly at
        # the version pinned in .mill-version. This mirrors what the
        # project's ./mill launcher does locally.
        #
        # From Mill 0.12.6+ the assembly is no longer uploaded to
        # GitHub releases; mill-dist on Maven Central is the canonical
        # home. The jar is the same shell-prefixed self-executable, so
        # it installs onto PATH unchanged. Downloading from the old
        # GitHub releases URL is what silently broke this workflow for
        # nine weeks after .mill-version moved to 0.12.11 (last green
        # run 2026-05-19, first 404 on 2026-05-25).
        run: |
          set -euo pipefail
          MILL_VERSION=$(tr -d '[:space:]' < .mill-version)
          curl -fL --retry 3 -o /tmp/mill "https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/${MILL_VERSION}/mill-dist-${MILL_VERSION}.jar"
          chmod +x /tmp/mill
          sudo install -m 0755 /tmp/mill /usr/local/bin/mill
          mill --version

      - name: Run Scala Steward
        uses: scala-steward-org/scala-steward-action@v2
        with:
          # STEWARD_TOKEN is a fine-grained PAT (contents: write +
          # pull-requests: write) that triggers downstream CI on
          # bot PRs. If absent, the default GITHUB_TOKEN is used and
          # the maintainer must manually trigger CI on Steward PRs
          # (close+reopen or push an empty commit).
          github-token: ${{ secrets.STEWARD_TOKEN || secrets.GITHUB_TOKEN }}
          repo-config: .scala-steward.conf
          author-email: 'scala-steward@siida.local'
          author-name: 'Scala Steward'
          signing-key: ${{ secrets.STEWARD_SIGNING_KEY }}
          ignore-opts-files: false
