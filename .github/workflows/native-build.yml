name: Native build (BN254 shim)

# Rebuilds modules/crypto/native/<triple>/libsiida_bn254.{so,dylib}
# across the supported target triples. Triggered manually
# (workflow_dispatch) or on changes to the shim source. The aggregate
# job opens a PR with the regenerated binaries; humans review the
# binary diffs (small) and merge.
#
# This workflow is SEPARATE from .github/workflows/ci.yml (the
# per-PR build gate that runs make check). The parity check in
# scripts/check-ci-parity.sh ignores it because it reads only the two
# ci.yml workflow files by exact path.
#
# Supported triples: linux-amd64, linux-arm64, darwin-arm64.
# darwin-amd64 (Intel mac) was originally in the matrix but the
# macos-13 GitHub-hosted runners are deprioritised and routinely
# queue-bound; the realistic deployment footprint for Siida is
# Apple Silicon + Linux servers, so the slot was dropped on
# 2026-05-18. To re-add: extend the matrix below and update
# NativeLoader.scala if it gains arch-specific behaviour.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'modules/crypto/native/main.go'
      - 'modules/crypto/native/go.mod'
      - 'modules/crypto/native/go.sum'
      - 'modules/crypto/native/build.sh'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: build / ${{ matrix.triple }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: so
          - triple: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            ext: so
          - triple: darwin-arm64
            runner: macos-14
            goos: darwin
            goarch: arm64
            ext: dylib
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: modules/crypto/native/go.mod
          cache: true
          cache-dependency-path: modules/crypto/native/go.sum

      - name: Build native shim
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: bash modules/crypto/native/build.sh

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: libsiida_bn254-${{ matrix.triple }}
          path: modules/crypto/native/${{ matrix.triple }}/libsiida_bn254.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 7

  aggregate:
    name: open PR with regenerated binaries
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: _native-build-artefacts

      - name: Place artefacts under modules/crypto/native/<triple>/
        run: |
          set -euo pipefail
          for arch in linux-amd64 linux-arm64; do
            mkdir -p "modules/crypto/native/${arch}"
            cp "_native-build-artefacts/libsiida_bn254-${arch}/libsiida_bn254.so" \
               "modules/crypto/native/${arch}/libsiida_bn254.so"
          done
          mkdir -p "modules/crypto/native/darwin-arm64"
          cp "_native-build-artefacts/libsiida_bn254-darwin-arm64/libsiida_bn254.dylib" \
             "modules/crypto/native/darwin-arm64/libsiida_bn254.dylib"
          rm -rf _native-build-artefacts

      - name: Open PR with the regenerated binaries
        uses: peter-evans/create-pull-request@v6
        with:
          branch: native-build/refresh-${{ github.run_id }}
          title: 'native: refresh BN254 shim binaries (3 arches)'
          body: |
            Automated refresh of the three `modules/crypto/native/<triple>/libsiida_bn254.{so,dylib}` binaries via the `native-build` matrix workflow. (darwin-amd64 is intentionally dropped — see workflow header.)

            **What to review**:
            - The diff is binary; visually inspect that each subdirectory contains a fresh file of plausible size (~3 MB).
            - Confirm `modules/crypto/native/main.go`, `go.mod`, `go.sum`, and `build.sh` are at the commit you expect.
            - After merging, run `make test` (or specifically `./mill modules.crypto.test`) to confirm the new binaries still pass the FFI smoke + KAT suites.

            Triggered by run ID `${{ github.run_id }}`.
          commit-message: 'native: refresh BN254 shim binaries (run ${{ github.run_id }})'
          delete-branch: true
