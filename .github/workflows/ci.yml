name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build / test (JVM 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: modules/crypto/native/go.mod
          cache-dependency-path: modules/crypto/native/go.sum

      - name: Cache Mill out
        uses: actions/cache@v4
        with:
          path: |
            out
            ~/.cache/mill
          key: mill-${{ runner.os }}-${{ hashFiles('.mill-version', 'build.mill') }}
          restore-keys: |
            mill-${{ runner.os }}-

      - name: Check licence headers
        run: make headers

      - name: Build native shim (host arch)
        run: bash modules/crypto/native/build.sh

      - name: Compile all modules
        run: make compile

      - name: Test all modules
        run: make test

      - name: Check CI parity
        run: make ci-parity
