name: CI

# Mirror of .github/workflows/ci.yml for Codeberg's Forgejo Actions
# runner. Kept in lockstep deliberately so a forced move between hosts
# is a no-op. Step names and ordering MUST match the GitHub workflow;
# scripts/check-ci-parity.sh enforces this at every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build / test (JVM 21)
    runs-on: docker
    container:
      image: eclipse-temurin:21-jdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        # JDK already provided by eclipse-temurin:21-jdk container image;
        # we keep the step (matching the GitHub workflow name) so the
        # parity script sees the same ordered list of step names.
        run: java -version

      - name: Setup Go
        # The eclipse-temurin container doesn't ship Go; install Go +
        # gcc (cgo needs gcc) via apt before the native build step. We
        # don't use actions/setup-go here because the Forgejo runner's
        # action availability differs from GitHub's and apt-pinning Go
        # is more deterministic for our use case anyway.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends golang-go gcc libc6-dev
          go version

      - name: Cache Mill out
        uses: actions/cache@v6
        with:
          path: |
            out
            ~/.cache/mill
          key: mill-forgejo-${{ hashFiles('.mill-version', 'build.mill') }}
          restore-keys: |
            mill-forgejo-

      - name: Check licence headers
        run: make headers

      - name: Build native shim (host arch)
        run: bash modules/crypto/native/build.sh

      - name: Compile all modules
        run: make compile

      - name: Test all modules
        run: make test

      - name: Check CI parity
        run: make ci-parity
